spring.application.name=greed-dungeon
app.cors.allowed-origins=http://localhost:4200

spring.config.import=optional:file:.env[.properties]

spring.security.user.name=${SPRING_SECURITY_USER_NAME:greed_dungeon_dev}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}
spring.security.user.roles=${SPRING_SECURITY_USER_ROLES:DEV}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/greed_dungeon_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:greed_dungeon_dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.docker.compose.enabled=false